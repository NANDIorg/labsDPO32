name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Backend тестирование и сборка
  backend:
    name: Backend CI/CD
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: lab2/backend/requirements.txt

    - name: Install dependencies
      working-directory: ./lab2/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov

    - name: Lint with flake8
      working-directory: ./lab2/backend
      run: |
        # Остановить сборку при синтаксических ошибках
        flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
        # Предупреждения (не критичные)
        flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      working-directory: ./lab2/backend
      run: |
        # Создать директорию для тестов если её нет
        mkdir -p tests
        # Запустить pytest если есть тесты
        if [ -d "tests" ] && [ "$(ls -A tests)" ]; then
          pytest tests/ --cov=app --cov-report=xml --cov-report=term
        else
          echo "No tests found, skipping..."
        fi

    - name: Build Backend Docker image
      working-directory: ./lab2
      run: |
        docker build -t reference-backend:${{ github.sha }} ./backend
        docker tag reference-backend:${{ github.sha }} reference-backend:latest

    - name: Test Backend container
      run: |
        # Запускаем контейнер с host network для доступа к БД на localhost
        docker run -d --name test-backend \
          --network host \
          -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db \
          reference-backend:latest
        sleep 10
        # Проверяем что контейнер запущен
        if docker ps | grep test-backend; then
          echo "Backend container is running"
          # Проверяем health endpoint
          curl -f http://localhost:8000/api/health || echo "Health check failed, but container is running"
        else
          echo "Backend container failed to start"
          docker logs test-backend
          exit 1
        fi
        docker stop test-backend
        docker rm test-backend

  # Frontend тестирование и сборка
  frontend:
    name: Frontend CI/CD
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          lab2/frontend/package-lock.json
          lab2/frontend/package.json

    - name: Install dependencies
      working-directory: ./lab2/frontend
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci
        else
          npm install
        fi

    - name: Lint and validate frontend
      working-directory: ./lab2/frontend
      run: |
        echo "Running frontend validation..."
        # Можно добавить lint команды если они есть в package.json
        # npm run lint

    - name: Build Frontend Docker image
      working-directory: ./lab2
      run: |
        docker build -t reference-frontend:${{ github.sha }} ./frontend
        docker tag reference-frontend:${{ github.sha }} reference-frontend:latest

    - name: Test Frontend container
      run: |
        echo "Starting frontend container..."
        docker run -d --name test-frontend \
          -p 3000:80 \
          reference-frontend:latest

        echo "Waiting for container to start..."
        sleep 3

        # Проверяем что контейнер запущен
        if docker ps -a | grep test-frontend | grep -q "Up"; then
          echo "✓ Frontend container is running"

          # Ждём инициализации nginx
          for i in {1..10}; do
            if curl -f -s http://localhost:3000 > /dev/null 2>&1; then
              echo "✓ Frontend is accessible"
              break
            fi
            echo "Waiting for frontend... ($i/10)"
            sleep 2
          done

          # Финальная проверка
          if curl -f http://localhost:3000 > /dev/null 2>&1; then
            echo "✓ Frontend health check passed"
          else
            echo "⚠ Frontend not fully accessible yet, but container is running"
          fi
        else
          echo "✗ Frontend container failed to start"
          echo "Container status:"
          docker ps -a | grep test-frontend
          echo "Container logs:"
          docker logs test-frontend
          exit 1
        fi

        docker stop test-frontend
        docker rm test-frontend

  # Интеграционное тестирование с docker-compose
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create logs directory
      working-directory: ./lab2
      run: mkdir -p logs

    - name: Build and start all services
      working-directory: ./lab2
      run: |
        docker-compose build
        docker-compose up -d

    - name: Wait for services to be ready
      working-directory: ./lab2
      run: |
        echo "Waiting for services to start..."
        sleep 15
        docker-compose ps

    - name: Check backend health
      run: |
        curl --retry 5 --retry-delay 5 --retry-connrefused http://localhost:8000/api/health

    - name: Check frontend availability
      run: |
        curl --retry 5 --retry-delay 5 --retry-connrefused http://localhost:3000

    - name: Check logs
      if: always()
      working-directory: ./lab2
      run: |
        echo "=== Backend logs ==="
        docker-compose logs backend
        echo "=== Frontend logs ==="
        docker-compose logs frontend
        echo "=== Database logs ==="
        docker-compose logs db

    - name: Check connection logs
      working-directory: ./lab2
      run: |
        if [ -f "logs/connections.log" ]; then
          echo "=== Connection logs ==="
          cat logs/connections.log
        else
          echo "No connection logs found"
        fi

    - name: Tear down services
      if: always()
      working-directory: ./lab2
      run: docker-compose down -v

